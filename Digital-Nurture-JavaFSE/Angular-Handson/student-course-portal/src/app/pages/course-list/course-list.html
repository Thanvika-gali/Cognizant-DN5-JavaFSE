<p *ngIf="isLoading$ | async">Loading courses...</p>
<p *ngIf="errorMessage$ | async as error">{{ error }}</p>
<label>Search courses <input type="text" [(ngModel)]="searchTerm" (ngModelChange)="updateSearch()"></label>
<section *ngIf="courses$ | async as courses; else noCourses" class="course-grid">
  <app-course-card *ngFor="let course of courses; trackBy: trackByCourseId" [course]="course" (enrollRequested)="onEnroll($event)"></app-course-card>
</section>
<ng-template #noCourses><p>No courses available.</p></ng-template>
<p *ngIf="selectedCourseId">Selected course ID: {{ selectedCourseId }}</p>
