<h1>Enrollment Request</h1><form #enrollForm="ngForm" (ngSubmit)="onSubmit(enrollForm)"><label>Name <input name="studentName" [(ngModel)]="model.studentName" #nameCtrl="ngModel" required minlength="3"></label><span *ngIf="nameCtrl.touched && nameCtrl.errors?.['required']">Name is required</span><span *ngIf="nameCtrl.touched && nameCtrl.errors?.['minlength']">Name must be at least 3 characters</span><label>Email <input name="studentEmail" type="email" [(ngModel)]="model.studentEmail" #emailCtrl="ngModel" required email></label><span *ngIf="emailCtrl.touched && emailCtrl.invalid">Enter a valid email</span><label>Course ID <input name="courseId" type="number" [(ngModel)]="model.courseId" #courseCtrl="ngModel" required></label><span *ngIf="courseCtrl.touched && courseCtrl.invalid">Course ID is required</span><label>Semester <select name="preferredSemester" [(ngModel)]="model.preferredSemester" required><option>Odd</option><option>Even</option></select></label><label><input name="agreeToTerms" type="checkbox" [(ngModel)]="model.agreeToTerms" #termsCtrl="ngModel" required> Agree to terms</label><span *ngIf="termsCtrl.touched && termsCtrl.invalid">You must agree to terms</span><button type="submit" [disabled]="enrollForm.invalid">Submit</button><button type="button" (click)="reset(enrollForm)">Reset</button></form><div *ngIf="submitted">Enrollment request submitted successfully!</div>
